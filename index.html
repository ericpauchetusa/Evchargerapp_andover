<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Live Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-10">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-black text-slate-800 tracking-tighter italic">⚡️Charge @Andover =S=</h1>
                <p class="text-slate-500 font-medium">Real-time charge point Station Availability at Andover car park - Schneider Electric</p>
            </div>
            <div id="live-indicator" class="flex items-center gap-2 bg-white px-3 py-1 rounded-full shadow-sm text-xs font-bold text-green-600 border border-green-100">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                </span>
                LIVE UPDATES
            </div>
        </header>

        <div id="parking-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tayqwvrzsbpcjekqilea.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRheXF3dnJ6c2JwY2pla3FpbGVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg5MzA1OTksImV4cCI6MjA4NDUwNjU5OX0.UraEiO2JbgfSyo6kYE-j5MjKNFjKNp2baZOiZ9iO7tI';
        var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function fetchStations() {
            const { data: chargers, error } = await supabaseClient
                .from('chargers')
                .select('*')
                .order('id', { ascending: true });

            if (!error) renderGrid(chargers);
        }

        function renderGrid(chargers) {
            const grid = document.getElementById('parking-grid');
            grid.innerHTML = ''; 

            chargers.forEach(slot => {
                const isOccupied = slot.status === 'occupied';
                const card = document.createElement('div');
                
                card.className = `p-5 rounded-2xl shadow-sm border-t-4 transition-all duration-300 ${
                    isOccupied ? 'bg-white border-red-500' : 'bg-white border-emerald-500 hover:shadow-md'
                }`;

                let timeString = "Available";
                if (slot.end_time) {
                    const time = new Date(slot.end_time);
                    timeString = `Until ${time.getHours()}:${time.getMinutes().toString().padStart(2, '0')}`;
                }

                card.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-2xl font-black text-slate-700">#${slot.id}</span>
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${isOccupied ? 'bg-red-50 text-red-600' : 'bg-emerald-50 text-emerald-600'}">
                            ${isOccupied ? 'In Use' : 'Free'}
                        </span>
                    </div>
                    <div class="space-y-1">
                        <p class="font-bold text-slate-800 truncate">${isOccupied ? slot.user_name : 'Plug in Now'}</p>
                        <p class="text-xs text-slate-400 font-medium tracking-wide uppercase">${isOccupied ? timeString : 'Ready'}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Listen for real-time changes
        supabaseClient.channel('custom-all-channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'chargers' }, () => {
                fetchStations();
            })
            .subscribe();

        fetchStations();
    </script>
</body>
</html>
