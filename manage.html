<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Action Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
    <div id="app" class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-slate-800">Station #<span id="slot-id">--</span></h1>
            <p id="status-badge" class="mt-2 inline-block px-3 py-1 rounded-full text-xs font-bold uppercase"></p>
        </div>
        
        <div id="form-container" class="space-y-4">
            <p class="text-center text-slate-500">Loading station data...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tayqwvrzsbpcjekqilea.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRheXF3dnJ6c2JwY2pla3FpbGVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg5MzA1OTksImV4cCI6MjA4NDUwNjU5OX0.UraEiO2JbgfSyo6kYE-j5MjKNFjKNp2baZOiZ9iO7tI';
        var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const params = new URLSearchParams(window.location.search);
        const slotId = params.get('slot');
        document.getElementById('slot-id').innerText = slotId;

        async function loadSlot() {
            const { data: slot } = await supabaseClient.from('chargers').select('*').eq('id', slotId).single();
            const container = document.getElementById('form-container');
            const badge = document.getElementById('status-badge');

            if (slot.status === 'available') {
                // UI for CHECKING IN
                badge.innerText = "Available";
                badge.className = "mt-2 inline-block px-3 py-1 rounded-full text-xs font-bold uppercase bg-green-100 text-green-700";
                
                container.innerHTML = `
                    <div>
                        <label class="block text-sm font-medium text-slate-700">Full Name</label>
                        <input id="userName" type="text" class="w-full mt-1 border border-slate-300 rounded-md p-2 shadow-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700">How many hours will you charge?</label>
                        <input id="duration" type="number" step="0.5" class="w-full mt-1 border border-slate-300 rounded-md p-2 shadow-sm" placeholder="e.g. 2.5">
                    </div>
                    <button onclick="checkIn()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">
                        Confirm & Start Charging
                    </button>
                `;
            } else {
                // UI for CHECKING OUT
                badge.innerText = "Occupied";
                badge.className = "mt-2 inline-block px-3 py-1 rounded-full text-xs font-bold uppercase bg-red-100 text-red-700";

                container.innerHTML = `
                    <div class="bg-slate-50 p-4 rounded-lg text-center">
                        <p class="text-sm text-slate-600">Currently used by</p>
                        <p class="text-xl font-bold text-slate-800">${slot.user_name}</p>
                    </div>
                    <button onclick="checkOut()" class="w-full bg-slate-800 hover:bg-black text-white font-bold py-3 rounded-lg transition">
                        I'm finished (Release Slot)
                    </button>
                `;
            }
        }

        async function checkIn() {
            const name = document.getElementById('userName').value;
            const hours = parseFloat(document.getElementById('duration').value);
            
            // Calculate finish time: Now + hours
            const endTime = new Date();
            endTime.setMinutes(endTime.getMinutes() + (hours * 60));

            const { error } = await supabaseClient.from('chargers').update({
                status: 'occupied',
                user_name: name,
                end_time: endTime.toISOString()
            }).eq('id', slotId);

            if (!error) window.location.href = "index.html"; // Send them to the dashboard
        }

        async function checkOut() {
            const { error } = await supabaseClient.from('chargers').update({
                status: 'available',
                user_name: null,
                end_time: null
            }).eq('id', slotId);

            if (!error) window.location.href = "index.html";
        }

        loadSlot();
    </script>
</body>
</html>
